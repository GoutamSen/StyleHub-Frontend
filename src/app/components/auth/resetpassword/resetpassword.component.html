<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resetpassword- StyleHub</title>
  <!-- Link external CSS -->
  <link rel="stylesheet" href="resetpassword.component.css">
</head>
<body>
<main class="reset-page">
  <div class="reset-card">
    <h2 class="reset-title">🔒 Reset Password</h2>
    <p class="reset-subtitle">Enter your email and set a new password to secure your account.</p>

    <form (ngSubmit)="onResetPassword()" #resetForm="ngForm" class="reset-form">

      <div class="input-group">
        <input
          type="password"
          [(ngModel)]="newPassword"
          name="newPassword"
          placeholder="Enter new password"
          required
        />
      </div>

      <div class="input-group">
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm new password"
          required
        />
      </div>

      <button type="submit" class="btn">Reset Password</button>
    </form>

    <!-- Messages -->
    <p *ngIf="successMessage" class="message success">{{ successMessage }}</p>
    <p *ngIf="errorMessage" class="message error">{{ errorMessage }}</p>
  </div>
</main>

</body>
</html>
