<main class="register-page">
  <div class="register-card">
    <h2 class="title">Create Account ✨</h2>
    <p class="subtitle">Join StyleHub and elevate your style journey</p>

    <!-- Reactive form -->
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <input type="text" formControlName="username" placeholder="User Name" required />
        <small *ngIf="signupForm.get('username')?.touched && signupForm.get('username')?.invalid">
          Username is required
        </small>
      </div>

      <div class="input-group">
        <input type="email" formControlName="email" placeholder="User Email" required />
        <small *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">
          Email is required
        </small>
      </div>

      <div class="input-group">
        <input type="number" formControlName="phoneNumber" placeholder="User Phone Number" required />
        <small *ngIf="signupForm.get('phoneNumber')?.touched && signupForm.get('phoneNumber')?.invalid">
          Phone Number is required
        </small>
      </div>

      <div class="input-group">
        <input type="password" formControlName="password" placeholder="User Password" required />
        <small *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
          Password is required
        </small>
      </div>

      <div class="input-group">
        <input type="test" formControlName="address" placeholder="User Address" required />
        <small *ngIf="signupForm.get('address')?.touched && signupForm.get('address')?.invalid">
          Password is required
        </small>
      </div>

      <button type="submit" class="btn" [disabled]="signupForm.invalid">Register</button>
    </form>

    <!-- Success & Error Messages -->
    <div *ngIf="successMessage" class="message success">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="message error">
      {{ errorMessage }}
    </div>

    <!-- Links -->
    <div class="register-links">
      <p>Already have an account? <a routerLink="/login">Login</a></p>
    </div>
  </div>
</main>
