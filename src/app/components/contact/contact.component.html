 <!-- main -->
<main class="contact-page">

  <!-- Hero Section -->
  <section class="contact-hero">
    <div class="overlay">
      <h1>📞 Contact <span>StyleHub</span></h1>
      <p>We’d love to hear from you! Reach out for appointments, queries, or collaborations.</p>
    </div>
  </section>

  <!-- Contact Info Section -->
  <section class="contact-info">
    <div class="info-card">
      <h3>📍 Address</h3>
      <p>123 Style Street, Downtown City, India</p>
    </div>
    <div class="info-card">
      <h3>📞 Phone</h3>
      <p>+91 98765 43210</p>
    </div>
    <div class="info-card">
      <h3>📧 Email</h3>
      <p>support@stylehub.com</p>
    </div>
  </section>

  <!-- Contact Form -->
  <section class="contact-form-section">
    <div class="form-container">
      <h2>Send us a Message 💌</h2>
      <form>
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Your Email" required />
        <input type="text" placeholder="Subject" required />
        <textarea rows="5" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

  <!-- Google Map -->
  <section class="map-section">
    <h2>Find Us Here 📍</h2>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3679.2293148797044!2d75.869246!3d22.748913!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3962fcaa0e20db15%3A0xc76c8a05a2b1!2sIndore!5e0!3m2!1sen!2sin!4v1693300000000"
      width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy">
    </iframe>
  </section>

</main>
