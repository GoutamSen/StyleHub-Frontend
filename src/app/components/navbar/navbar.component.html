<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleHub Navbar</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="navbar.component.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow custom-navbar">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold logo" href="#">💈 StyleHub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto nav-links">


          <!-- Home -->
          <li class="nav-item">
            <a class="nav-link active" routerLink="">Home</a>
          </li>

          <!-- Services Dropdown -->
          <!-- Services Dropdown -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" role="button">
              Services
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" [routerLink]="['/serviceimage', 'haircut']">✂️ Haircut </a></li>
              <li><a class="dropdown-item" [routerLink]="['/serviceimage', 'hairstyle']">✂️ HairStyle</a></li>
              <li><a class="dropdown-item" [routerLink]="['/serviceimage', 'hairspa']">💆 Hair Spa & Treatment</a></li>
              <li><a class="dropdown-item" [routerLink]="['/serviceimage', 'coloring']">🎨 Hair Coloring</a></li>
              <li><a class="dropdown-item" [routerLink]="['/serviceimage', 'beard']">🧔 Beard Trim & Styling</a></li>
              <li><a class="dropdown-item" [routerLink]="['/serviceimage', 'bridal']">💇‍♀️ Bridal & Groom Package</a>
              </li>
            </ul>
          </li>

          <!-- Other Links -->
          <li class="nav-item">
            <a class="nav-link" routerLink="/contact">Contact</a>
          </li>
          <li class="nav-item" *ngIf="!authServices.isLoggedIn()">
            <a class="nav-link" routerLink="/login">Login</a>
          </li>

          <!-- Show Logout if user IS logged in -->
          <li class="nav-item" *ngIf="authServices.isLoggedIn()">
            <a class="nav-link" (click)="logout()">Logout</a>
          </li>


        </ul>
        <!-- Login / Logout -->
        <!-- <div class="d-flex ms-auto">
          <button *ngIf="!authServices.isLoggedIn()" routerLink="/login" class="btn btn-success me-2">
            Login
          </button>
          <button *ngIf="authServices.isLoggedIn()" (click)="logout()" class="btn btn-danger">
            Logout
          </button>
        </div> -->

      </div>
    </div>
  </nav>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
